spring:
  application:
    name: courselens-monolith
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/courselens?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USER:courselens}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
