server:
  port: ${SERVER_PORT:18082}
spring:
  application:
    name: course-service
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/courselens_course?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:course_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health
dependency:
  base-url: ${USER_SERVICE_URL:http://127.0.0.1:18081}
  connect-timeout-ms: ${CONNECT_TIMEOUT_MS:1500}
  read-timeout-ms: ${READ_TIMEOUT_MS:2000}
