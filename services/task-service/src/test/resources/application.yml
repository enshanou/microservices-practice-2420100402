spring:
  cloud:
    openfeign:
      client:
        config:
          course-service:
            connect-timeout: 200
            read-timeout: 200
    loadbalancer:
      cache:
        enabled: false
      retry:
        enabled: false
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
  datasource:
    url: jdbc:h2:mem:task;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
dependency:
  service-name: course-service
  connect-timeout-ms: 200
  read-timeout-ms: 200
