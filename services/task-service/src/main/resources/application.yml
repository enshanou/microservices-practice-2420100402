server:
  port: ${SERVER_PORT:18083}
spring:
  task:
    scheduling:
      pool:
        size: 2
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1025MB
  cloud:
    openfeign:
      client:
        config:
          course-service:
            connect-timeout: ${CONNECT_TIMEOUT_MS:1500}
            read-timeout: ${READ_TIMEOUT_MS:2000}
    loadbalancer:
      cache:
        enabled: false
      retry:
        enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:COURSELENS_2420100402}
  application:
    name: task-service
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/courselens_task?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:task_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health
dependency:
  service-name: course-service
  connect-timeout-ms: ${CONNECT_TIMEOUT_MS:1500}
  read-timeout-ms: ${READ_TIMEOUT_MS:2000}
