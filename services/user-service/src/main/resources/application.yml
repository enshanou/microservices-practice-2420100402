server:
  port: ${SERVER_PORT:18081}
spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:COURSELENS_2420100402}
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/courselens_user?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:user_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health
auth:
  enabled: ${AUTH_ENABLED:false}
  jwt-secret: ${AUTH_JWT_SECRET:}
  user-password-hash: ${AUTH_USER_PASSWORD_HASH:}
  admin-password-hash: ${AUTH_ADMIN_PASSWORD_HASH:}
