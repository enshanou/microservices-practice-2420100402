server:
  port: ${SERVER_PORT:18081}
spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/courselens_user?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:user_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health
